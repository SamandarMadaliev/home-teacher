version: '3.8'

services:
  # Laravel application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-teacher-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-home_teacher}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      - db
    networks:
      - home-teacher-network

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: home-teacher-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-home_teacher}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - home-teacher-network

networks:
  home-teacher-network:
    driver: bridge

volumes:
  postgres_data:
